hydra:
  job:
    chdir: false
  run:
    dir: ${experiment.output_dir}

# Experiment details
experiment:
  seed: 42
  name: "baseline-span-marker-${model.pretrained_model_name_or_path}-${dataset.id}"
  output_dir: "models/${experiment.name}"
  checkpoint_path: ${experiment.output_dir}/best_model

# Dataset configuration
dataset:
  id: "conll2003"
  name: "CoNLL 2003"

# Model configuration
model:
  # This tells instantiate() how to instantiate the SpanMarkerModel class
  _target_: span_marker.SpanMarkerModel.from_pretrained
  # Arguments for from_pretrained
  pretrained_model_name_or_path: "xlm-roberta-base"
  model_max_length: 128
  marker_max_length: 64
  entity_max_length: 6

# Training arguments
trainer:
  # This tells instantiate() where to find the Trainer class
  _target_: span_marker.trainer.Trainer
  args:
    _target_: transformers.TrainingArguments
    output_dir: ${experiment.output_dir}
    num_train_epochs: 10
    learning_rate: 1e-4
    per_device_train_batch_size: 32
    per_device_eval_batch_size: 32
    eval_accumulation_steps: 16
    weight_decay: 0.01
    warmup_ratio: 0.1
    bf16: True # Replace `bf16` with `fp16` if your hardware can't use bf16.
    dataloader_num_workers: 8
    logging_first_step: True
    logging_steps: 10
    eval_strategy: "epoch"
    metric_for_best_model: overall_f1
    save_strategy: "epoch"
    save_total_limit: 1
    load_best_model_at_end: true
    report_to: "wandb"
    run_name: "${experiment.name}"
